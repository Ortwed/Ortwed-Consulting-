<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAFA">
<title>CO Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   Lyst, rent tema i Linear/Notion-stil, efter Christians mock
   (forside/, november 2026). Alt theming sidder i :root.
   Dark mode kommer som [data-theme="dark"] med samme navne.
   ========================================================= */
:root {
  --bg: #FAFAFA;
  --card: #FFFFFF;
  --card-alt: #F4F4F5;
  --card-soft: #FAFAFA;

  --text: #0A0A0A;
  --text-muted: #52525B;
  --text-dim: #71717A;
  --text-faint: #A1A1AA;

  --line: #ECECEC;
  --line-soft: #F4F4F5;

  --accent: #4F46E5;
  --accent-soft: #EEF2FF;
  --accent-ink: #4338CA;
  --accent-ring: #C7D2FE;
  --success: #16A34A;
  --live: #22C55E;
  /* Ikke i mocken, men nødvendige: rød til forsinket, gul til "noget fejler". */
  --danger: #DC2626;
  --danger-soft: #FEF2F2;
  --warn: #F59E0B;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --font: 'Inter', system-ui, -apple-system, sans-serif;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-ink); }
h1, h2, h3, h4 { margin: 0; }
ul { list-style: none; padding: 0; margin: 0; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.muted { color: var(--text-dim); }
.small { font-size: 11px; }
.muted.small { margin-top: 3px; }
.link { font-size: 12px; background: none; border: none; padding: 0; color: var(--accent); }
.link:hover { color: var(--accent-ink); }
.tom { color: var(--text-dim); font-size: 13px; padding: 4px 0; }
.fejltekst { color: var(--danger); font-size: 13px; }

/* ---------- Login ---------- */
#login {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.login-boks {
  width: 100%; max-width: 360px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
}
.login-boks .brand { padding: 0; margin-bottom: 24px; }
.login-boks h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
.login-boks .btn-primary { width: 100%; margin-top: 20px; padding: 11px 16px; }

/* ---------- Formularer ---------- */
label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 14px 0 6px; }
input, select, textarea {
  width: 100%;
  font: inherit; font-size: 14px;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 9px 11px;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fejl {
  margin-top: 14px;
  background: var(--danger-soft);
  color: var(--danger);
  border-radius: var(--radius-md);
  padding: 9px 12px;
  font-size: 13px;
}

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  position: sticky; top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 32px; }
.brand-mark {
  width: 28px; height: 28px;
  background: var(--text); color: #FFF;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
}
.brand-name { font-weight: 600; font-size: 14px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  background: none; border: none; text-align: left;
  font-size: 14px;
}
.nav-item:hover { background: var(--card-soft); color: var(--text); }
.nav-item.is-active { background: var(--card-alt); color: var(--text); font-weight: 500; }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; flex-shrink: 0; }
.nav-item.is-active .nav-dot { background: var(--accent); }
.nav-badge {
  margin-left: auto;
  font-size: 11px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft);
  padding: 1px 7px; border-radius: 10px;
}

.user {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #E4E4E7;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; }
.user-org { font-size: 11px; color: var(--text-dim); }
.user .link { color: var(--text-dim); font-size: 11px; }
.user .link:hover { color: var(--text); }

.main { flex: 1; min-width: 0; padding: 36px 44px 56px; }

/* ---------- Topbar ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 32px; }
.topbar-date { color: var(--text-dim); font-size: 13px; }
.topbar-greeting { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.status-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 7px 12px;
  font-size: 13px; color: var(--text-muted);
  white-space: nowrap;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
.status-chip.ok .status-dot { background: var(--live); }
.status-chip.fejl .status-dot { background: var(--warn); }

.btn-primary {
  background: var(--text); color: #FFF;
  border: none; border-radius: var(--radius-md);
  padding: 9px 16px;
  font-size: 13px; font-weight: 500;
  white-space: nowrap;
}
.btn-primary:hover { background: #262626; }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-sekundaer {
  background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-md);
  padding: 8px 14px; font-size: 13px; font-weight: 500;
}
.btn-sekundaer:hover { background: var(--card-soft); }

/* ---------- Cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
}
.card--compact { padding: 20px 24px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 600; }
.card-foot { margin-top: 12px; font-size: 12px; color: var(--text-faint); }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  position: relative;
}
.stat-label { color: var(--text-dim); font-size: 12px; font-weight: 500; }
.stat-row { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; min-width: 0; }
.stat-value { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
.stat-value--accent { color: var(--accent); }
.stat-meta { color: var(--text-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-marker {
  position: absolute; top: 14px; right: 14px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}

/* ---------- Grid ---------- */
.grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* ---------- Segmented control ---------- */
.segmented {
  display: flex; gap: 2px;
  background: var(--card-alt);
  padding: 2px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.segmented button {
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 9px;
  border-radius: 4px;
  background: none; border: none;
}
.segmented button.is-active { background: var(--card); color: var(--text); font-weight: 500; }
.segmented button[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }

/* ---------- Grafkort ---------- */
.chart-card { color: var(--chart-color, var(--accent)); }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.chart-title { display: flex; align-items: center; gap: 8px; }
.chart-title h2 { font-size: 15px; font-weight: 600; color: var(--text); }
.chart-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
.tag {
  color: var(--text-dim);
  font-size: 11px; font-weight: 500;
  padding: 2px 7px;
  background: var(--card-alt);
  border-radius: 4px;
}
.chart-metric { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
.chart-value { color: var(--text); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.chart-delta { font-size: 12px; font-weight: 500; }
.chart-delta--up { color: var(--success); }
.chart-delta--down { color: var(--danger); }
.chart-caption { color: var(--text-faint); font-size: 12px; }

.chart-plot { position: relative; }
.chart-plot svg { width: 100%; height: 140px; display: block; }
.chart-plot--tom svg { height: 72px; }
.grid-line { stroke: var(--line-soft); stroke-width: 1; vector-effect: non-scaling-stroke; }
/* Ingen fill her: CSS slår SVG-attributter, og så forsvinder gradienten
   fra fill="url(#...)". Mocken havde den fejl. */
.chart-line {
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linejoin: round; stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.chart-end-dot {
  position: absolute; right: -5px;
  top: calc(var(--end-y, 0%) - 5px);
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--card);
  border: 2.5px solid currentColor;
}
/* Tom graf: vises når GA4 ikke er sat op, ikke svarer eller stadig henter. */
.chart-tom {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  font-size: 13px; color: var(--text-dim);
  padding: 0 24px;
}
.chart-tom code { font-size: 12px; background: var(--card-alt); padding: 1px 5px; border-radius: 4px; color: var(--text-muted); }
.chart-hover {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--line);
  pointer-events: none;
}
.chart-tip {
  position: absolute; top: -6px;
  transform: translateX(-50%);
  background: var(--text); color: #FFF;
  font-size: 11px; white-space: nowrap;
  padding: 3px 7px; border-radius: 4px;
  pointer-events: none;
}
.chart-xaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); margin-top: 8px; }

.chart-substats {
  display: flex; flex-wrap: wrap; gap: 14px 32px;
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid var(--line-soft);
}
.substat { min-width: 0; }
.substat-label {
  color: var(--text-dim);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.substat-value { color: var(--text); font-size: 18px; font-weight: 600; margin-top: 2px; }
.substat-text {
  color: var(--text); font-size: 14px; font-weight: 500; margin-top: 4px;
  max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Search Console-delen nederst i grafkortet. */
.gsc { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); color: var(--text); }
.gsc-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.gsc-note { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.gsc-note b { color: var(--text); font-weight: 500; }
.gsc-tabel { width: 100%; border-collapse: collapse; font-size: 13px; }
.gsc-tabel td { padding: 6px 0; border-top: 1px solid var(--line-soft); }
.gsc-tabel td.tal { text-align: right; color: var(--text-muted); width: 72px; font-variant-numeric: tabular-nums; }
.gsc-tabel th {
  text-align: right; font-weight: 500; font-size: 11px; color: var(--text-faint);
  padding-bottom: 4px;
}
.gsc-tabel th:first-child { text-align: left; }

/* ---------- Uge ---------- */
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.day { background: var(--card-soft); border-radius: 10px; padding: 14px 12px; min-width: 0; }
.day-dow { color: var(--text-dim); font-size: 11px; font-weight: 500; text-transform: uppercase; }
.day-num { font-size: 20px; font-weight: 600; margin-top: 2px; }
.day-empty { color: var(--text-faint); font-size: 12px; margin-top: 14px; }
.day-event { font-size: 11px; margin-top: 10px; }
.day-event-time { font-weight: 600; color: var(--text); }
.day-event--crm .day-event-time { color: var(--accent); }
.day-event-text { color: var(--text-muted); margin-top: 2px; line-height: 1.3; overflow-wrap: anywhere; }
.day-mere { font-size: 11px; color: var(--text-faint); margin-top: 8px; }
.day--today { background: var(--accent-soft); border: 1px solid var(--accent-ring); }
.day--today .day-dow { color: var(--accent); font-weight: 600; }
.day--today .day-num { color: var(--accent-ink); }
.day--today .day-empty { color: #6366F1; }

/* ---------- Opgaver ---------- */
.tasks { display: flex; flex-direction: column; }
.task {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 0;
  border-top: 1px solid var(--line-soft);
  color: var(--text);
}
a.task:hover .task-title { color: var(--accent); }
.task-check {
  width: 18px; height: 18px;
  border: 1.5px solid #D4D4D8;
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--card);
  padding: 0;
}
button.task-check:hover { border-color: var(--accent); background: var(--accent-soft); }
.task-check--ikon { border-style: dashed; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; }
.task-meta { color: var(--text-faint); font-size: 12px; margin-top: 2px; }

/* ---------- Pill ---------- */
.pill {
  font-size: 11px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.pill--sent { color: var(--danger); background: var(--danger-soft); }
.pill--graa { color: var(--text-dim); background: var(--card-alt); }

/* ---------- Lister ---------- */
.list li, .list > a {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
  padding: 9px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 13.5px;
  color: var(--text);
}
.list > a:hover .list-titel { color: var(--accent); }
.list-titel { min-width: 0; }
.list-hoejre { flex-shrink: 0; display: flex; gap: 6px; align-items: baseline; }
.afkort { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Skelet mens der hentes ---------- */
.skel {
  display: inline-block;
  background: var(--card-alt);
  border-radius: 4px;
  color: transparent !important;
  animation: puls 1.4s ease-in-out infinite;
}
.skel-linje { height: 12px; margin: 12px 0; border-radius: 4px; background: var(--card-alt); animation: puls 1.4s ease-in-out infinite; }
.skel-linje:nth-child(2n) { width: 70%; }
@keyframes puls { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) {
  .skel, .skel-linje { animation: none; }
  #panel { transition: none; }
}

/* ---------- Pladsholder for faner der ikke er bygget ---------- */
.side-head { margin-bottom: 24px; }
.side-head h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.side-head p { color: var(--text-dim); margin-top: 4px; }

.side-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.side-head .muted { margin-top: 4px; }

/* ---------- Emner: kunder, sager, kontakter, møder i lister ---------- */
.emne {
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-bottom: 8px;
  color: var(--text);
}
.emne.klik { cursor: pointer; }
.emne.klik:hover { border-color: var(--accent-ring); }
.emne-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.emne-titel { font-weight: 500; }
.emne-under { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.emne-vaerdi { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.emne-fod { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
.emne p { margin-top: 10px; font-size: 13px; color: var(--text-muted); white-space: pre-wrap; }
.panel-krop .emne { background: var(--card-soft); }

.soeg { margin-bottom: 16px; }

/* Pipeline: ét kort per trin, bjælken er værdi i forhold til største trin. */
.trin { margin-bottom: 14px; }
.trin-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.trin-head h2 { font-size: 15px; font-weight: 600; }
.trin-sum { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.bjaelke { height: 4px; background: var(--card-alt); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
.bjaelke i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.trin .emne { background: var(--card-soft); }

/* Afsnit i panelet. */
.afsnit { margin-top: 26px; }
.afsnit h4 {
  font-size: 11px; font-weight: 500; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .04em;
  margin-bottom: 10px;
}
.afsnit .btn-sekundaer, .panel-krop > .btn-sekundaer { width: 100%; margin-top: 8px; }
.btn-fare { background: var(--card); color: var(--danger); border: 1px solid #FECACA; border-radius: var(--radius-md); padding: 8px 14px; font-size: 13px; font-weight: 500; width: 100%; }
.btn-fare:hover { background: var(--danger-soft); }
.log { padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
.log .muted { font-size: 12px; margin-top: 2px; }
.hjaelp { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.tjek { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-top: 16px; }
.tjek input { width: auto; }

/* Måned- og dagsoverskrifter i lister. */
.overskrift {
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  margin: 22px 0 8px;
}
/* Kun første bogstav. capitalize ville give "Torsdag 19. November". */
.overskrift::first-letter { text-transform: uppercase; }
.overskrift:first-child { margin-top: 0; }

.fdag-raekke {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 0;
  border-top: 1px solid var(--line-soft);
  cursor: pointer;
}
.fdag-raekke:hover .fdag-navn { color: var(--accent); }
.fdag-dato { width: 32px; font-size: 18px; font-weight: 600; text-align: center; flex-shrink: 0; }
.fdag-raekke.idag .fdag-dato { color: var(--accent); }
.fdag-tekst { flex: 1; min-width: 0; }
.fdag-om { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

.stats--tre { grid-template-columns: repeat(3, 1fr); }
.lyd { display: block; }

/* ---------- Slide-in panel ---------- */
#slor {
  position: fixed; inset: 0;
  background: rgba(10, 10, 10, .18);
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  z-index: 20;
}
#slor.vis { opacity: 1; pointer-events: auto; }
#panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 440px; max-width: 100%;
  background: var(--card);
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  transition: transform .22s ease;
  z-index: 21;
  display: flex; flex-direction: column;
}
#panel.vis { transform: none; }
.panel-head {

  .par { grid-template-columns: 1fr; }
}

<script>
/* ============================================================
   1. OPSÆTNING
   Publishable key må gerne stå her. Den giver ingen adgang i

const SUPABASE_URL  = "https://fjbrfkkcsszolbgrjdbj.supabase.co";
const SUPABASE_ANON = "sb_publishable_FO-vUOhZtGJYJd4e4Xy_hg_j2AJtvkI";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* De websites der vises grafkort for. Et nyt site tilføjes her og
   ingen andre steder: grafkoden, /api/analytics og Apps Scriptet læser
   alle herfra.

/* Alle kald til /api/ sender login med. Serveren afviser kald uden,
   så fremmede ikke kan læse mails og opgaver ved at kende adressen. */
async function apiHent(sti, valg = {}){
  const { data } = await db.auth.getSession();
  const token = data?.session?.access_token || "";
  return fetch(sti, { ...valg, headers: { ...(valg.headers || {}), authorization: `Bearer ${token}` } });
}

/* ============================================================
   2. HJÆLPERE
   ============================================================ */
const $ = s => document.querySelector(s);
const sikker = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kort = d => d ? new Date(d).toLocaleDateString("da-DK", {day:"numeric", month:"short"}) : "";
const klokken = d => new Date(d).toLocaleTimeString("da-DK", {hour:"2-digit", minute:"2-digit"});
const tal = n => n == null ? "–" : Number(n).toLocaleString("da-DK");
const decimal = n => n == null ? "–" : Number(n).toLocaleString("da-DK", {maximumFractionDigits: 1});

/* Datoen som "2026-11-19" i lokal tid. toISOString() giver UTC, og så
   hopper datoen en dag tilbage mellem midnat og klokken et eller to. */
const lokalDato = (d = new Date()) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};

const kr = n => n == null || n === "" ? "" : new Intl.NumberFormat("da-DK",
  {style: "currency", currency: "DKK", maximumFractionDigits: 0}).format(n);
const dato = d => d ? new Date(d).toLocaleDateString("da-DK", {day: "numeric", month: "short", year: "numeric"}) : "";
const dagNavn = d => new Date(d).toLocaleDateString("da-DK", {weekday: "long", day: "numeric", month: "long"});
const webUrl = w => /^https?:\/\//i.test(w) ? sikker(w) : "https://" + sikker(w);
const ansatAf = k => (k.ansaettelser || []).find(a => a.nuvaerende);
// Til <input type="datetime-local">, der vil have lokal tid uden tidszone.
const lokalInput = d => {
  const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
  return x.toISOString().slice(0, 16);
};
// Fejl fra et felt i panelet vises i panelets egen fejlboks.
const panelFejl = (id, tekst) => { $(id).innerHTML = `<div class="fejl">${sikker(tekst)}</div>`; };

const TRIN = [
  ["ny", "Ny"],
  ["kvalificeret", "Kvalificeret"],
  ["besigtigelse", "Besigtigelse"],
  ["tilbud_sendt", "Tilbud sendt"],
  ["forhandling", "Forhandling"]
];
const ALLE_TRIN = [...TRIN, ["vundet", "Vundet"], ["tabt", "Tabt"]];
const trinNavn = k => (ALLE_TRIN.find(t => t[0] === k) || [k, k])[1];
const tilbudNavn = k => ({kladde: "Kladde", sendt: "Sendt", accepteret: "Accepteret", afvist: "Afvist"})[k] || trinNavn(k);

const AKTIVITET = [
  ["opkald", "Opkald"], ["mail", "Mail"], ["moede", "Møde"],
  ["besigtigelse", "Besigtigelse"], ["note", "Note"]
];
const aktNavn = k => (AKTIVITET.find(a => a[0] === k) || [k, k])[1];

// "Mine egne" afgøres af slug, så navnet frit kan ændres.
let virksomheder = [];
let egneNavne = new Set();
const erEgen = navn => egneNavne.has(navn);
const virksomhedPill = v => v ? `<span class="pill${erEgen(v) ? "" : " pill--graa"}">${sikker(v)}</span>` : "";

const DAGE = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
const MAANEDER = ["januar","februar","marts","april","maj","juni","juli",
                  "august","september","oktober","november","december"];

// Bygget i hånden, fordi browserens danske format siger "torsdag den 19. november".
function datoLinje(d = new Date()){
  const dag = DAGE[d.getDay()];
  return `${dag[0].toUpperCase()}${dag.slice(1)} ${d.getDate()}. ${MAANEDER[d.getMonth()]} ${d.getFullYear()}`;
}

function hilsen(){
  const t = new Date().getHours();
  return t < 5 ? "God nat" : t < 10 ? "God morgen" : t < 12 ? "God formiddag"
       : t < 18 ? "God eftermiddag" : "God aften";
}

function ugeStart(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);   // mandag
  return d;
}

// ISO-ugenummer, som det står i en dansk kalender.
function ugeNr(d){
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
  const nytaar = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - nytaar) / 864e5 + 1) / 7);
}

$("#login-form").onsubmit = async e => {

  const knap = $("#log-ind");
  knap.disabled = true;
  knap.textContent = "Logger ind…";

  hilsVedLogin = true;   // klikket her er det der giver browseren lov til at tale
  const { error } = await db.auth.signInWithPassword({
    email: $("#mail").value.trim(),
    password: $("#kode").value

  if (error){
    $("#login-fejl").innerHTML = `<div class="fejl">${sikker(error.message)}</div>`;
    knap.disabled = false;
    knap.textContent = "Log ind";
    hilsVedLogin = false;
  }
};
$("#log-ud").onclick = () => db.auth.signOut();

let startet = false;
db.auth.onAuthStateChange((_, session) => {
  if (session){
    // Supabase sender også et event når tokenet fornyes. Det skal ikke
    // tegne hele appen forfra midt i det man laver.
    if (!startet) start();
  } else {
    startet = false;
    $("#app").hidden = true;
    $("#login").hidden = false;
    $("#log-ind").disabled = false;
    $("#log-ind").textContent = "Log ind";
  }
});

async function start(){
  startet = true;
  $("#login").hidden = true;
  $("#app").hidden = false;
  const { data } = await db.from("virksomheder").select("*");
  egneNavne = new Set((data || []).filter(v => v.slug === "web").map(v => v.navn));
  // Mine egne øverst, resten alfabetisk.
  virksomheder = (data || []).sort((a, b) =>
    (erEgen(b.navn) - erEgen(a.navn)) || a.navn.localeCompare(b.navn, "da"));
  // Fanen står i adressen, så en genindlæsning bliver på samme fane.
  const fane = location.hash.slice(1);
  visFane(FANER[fane] ? fane : "forside");
  taelOpfoelgning();
}

function visFane(navn){
  document.querySelectorAll(".nav-item").forEach(b =>
    b.classList.toggle("is-active", b.dataset.fane === navn));
  history.replaceState(null, "", "#" + navn);
  lukPanel();
  window.scrollTo(0, 0);
  FANER[navn]();
}

// Overskrift på en fane med valgfri knap til højre.
function sideHoved(titel, under, knap = ""){
  return `<header class="side-head">
    <div><h1>${titel}</h1>${under ? `<p class="muted">${under}</p>` : ""}</div>

}
function henter(){ $("#indhold").innerHTML = `<section class="card">${skelet(4)}</section>`; }
function visFejl(e){

}

/* ============================================================
   5. PANEL
   Glider ind fra højre. Bruges til alt der oprettes eller rettes.
   ============================================================ */
function aabnPanel(eyebrow, titel, under, krop){
  $("#panel").innerHTML = `
    <div class="panel-head">
      <div>
        <div class="panel-eyebrow">${eyebrow}</div>
        <h3>${titel}</h3>
        ${under ? `<div class="panel-under">${under}</div>` : ""}
      </div>
      <button type="button" class="panel-luk" onclick="lukPanel()" aria-label="Luk">&times;</button>
    </div>
    <div class="panel-krop">${krop}</div>`;
  $("#panel").classList.add("vis");
  $("#panel").setAttribute("aria-hidden", "false");
  $("#slor").classList.add("vis");
}
function lukPanel(){
  $("#panel").classList.remove("vis");
  $("#panel").setAttribute("aria-hidden", "true");
  $("#slor").classList.remove("vis");
}
$("#slor").onclick = lukPanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") lukPanel(); });

/* ---------- opgaver ----------
   En opgave behøver ikke en sag. Kunden er valgfri. */
let kundeListe = [];
async function hentKunder(){
  const { data } = await db.from("kunder").select("id,navn").order("navn");
  kundeListe = data || [];
  return kundeListe;
}

async function nyOpgave(){
  await hentKunder();
  aabnPanel("Opret", "Ny opgave", "", `
    <label for="no-titel">Hvad skal gøres?</label>
    <input id="no-titel" placeholder="Ring og følg op">
    <div class="par">
      <div><label for="no-dato">Forfalder</label>
        <input id="no-dato" type="date" value="${lokalDato()}"></div>
      <div><label for="no-kunde">Kunde</label>
        <select id="no-kunde"><option value="">Ingen</option>
          ${kundeListe.map(k => `<option value="${sikker(k.id)}">${sikker(k.navn)}</option>`).join("")}</select></div>
    </div>
    <div id="no-fejl"></div>
    <button type="button" class="btn-primary" onclick="gemNyOpgave()">Gem opgave</button>`);
  $("#no-titel").focus();
  $("#no-titel").onkeydown = e => { if (e.key === "Enter") gemNyOpgave(); };
}

async function gemNyOpgave(){
  const titel = $("#no-titel").value.trim();
  const d = $("#no-dato").value;
  if (!titel || !d) return ($("#no-fejl").innerHTML = `<div class="fejl">Opgaven skal have en titel og en dato.</div>`);
  const { data: bruger } = await db.auth.getUser();
  const { error } = await db.from("opgaver").insert({
    titel,
    forfalder_dato: d,
    kunde_id: $("#no-kunde").value || null,
    ansvarlig_id: bruger?.user?.id || null
  });
  if (error) return ($("#no-fejl").innerHTML = `<div class="fejl">${sikker(error.message)}</div>`);
  lukPanel();
  taelOpfoelgning();
  if (location.hash === "#forside") visForside();
  if (location.hash === "#opfoelgning") visOpfoelgning();
}

async function lukOpgave(id){
  const { error } = await db.from("opgaver")
    .update({afsluttet: true, afsluttet_dato: new Date().toISOString()})
    .eq("id", id);
  if (error) return alert("Kunne ikke lukke opgaven: " + error.message);
  taelOpfoelgning();
  if (location.hash === "#opfoelgning") return visOpfoelgning();
  // Kun kortet tegnes om, ikke hele forsiden, så graferne ikke blinker.
  crmOpgaver = crmOpgaver.filter(t => t.id !== id);
  forsideTal.opgaverCrm = crmOpgaver.length;
  tegnHandling();
  tegnStats();
}

// Prikken ved Opfølgning: åbne CRM-opgaver der forfalder i dag eller før.
async function taelOpfoelgning(){
  const { count } = await db.from("opgaver")
    .select("id", {count: "exact", head: true})
    .eq("afsluttet", false)
    .lte("forfalder_dato", lokalDato());
  const p = $("#prik");
  p.hidden = !count;
  p.textContent = count || "";
}

let forsideHilsen = { moeder: 0, handling: 0, foedselar: [] };

function kildeStatus(navn, status){
  kilder[navn] = status;          // "henter", "ok" eller en fejltekst
  const chip = $("#status-chip");
  if (!chip) return;
  const v = Object.values(kilder);
  const fejl = Object.entries(kilder).filter(([, s]) => s !== "henter" && s !== "ok");
  chip.className = "status-chip" + (v.includes("henter") ? "" : fejl.length ? " fejl" : " ok");
  chip.title = fejl.map(([k, s]) => `${k}: ${s}`).join("\n");
  $("#status-tekst").textContent = v.includes("henter") ? "Henter data"
    : fejl.length ? `${fejl.length} ${fejl.length === 1 ? "kilde fejler" : "kilder fejler"}`
    : "Alt hentet";
}

        <section class="card">

              ${Object.entries(SPOR).map(([k, n]) =>

  tegnStats();
  SITES.forEach(tegnSite);
  tegnUge();
  tegnHandling();

  hentCrm();
  hentTodoist();
  hentIndbakke();
  hentNyheder();
  hentAnalytik();
}

const skelet = n => Array.from({length: n}, () => `<div class="skel-linje"></div>`).join("");

/* ---------- stats-rækken ---------- */
function tegnStats(){
  const boks = $("#stats");
  if (!boks) return;
  const t = forsideTal;
  const sum = (...x) => x.some(v => v == null) ? null : x.reduce((a, b) => a + b, 0);
  const moeder = sum(t.moederCrm, t.moederGoogle ?? 0);   // Google kommer senere eller aldrig
  const forfaldne = sum(t.opgaverCrm, t.todoist ?? 0);

  const stat = (label, vaerdi, meta, fremhaev = false) => `
    <article class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-row">
        <div class="stat-value${fremhaev ? " stat-value--accent" : ""}${vaerdi == null ? " skel" : ""}">${vaerdi == null ? "00" : tal(vaerdi)}</div>
        <div class="stat-meta">${meta}</div>
      </div>
      ${fremhaev ? `<span class="stat-marker" aria-hidden="true"></span>` : ""}
    </article>`;

  boks.innerHTML =
    stat("Møder i ugen", moeder,
      t.naeste ? `næste ${sikker(t.naeste)}` : moeder ? "resten er overstået" : "tom uge") +
    stat("Forfaldne opgaver", forfaldne, forfaldne ? "kræver handling" : "alt er ajour", forfaldne > 0) +
    stat("Kontakter", t.kontakter, "i netværket") +
    stat("Ulæst post", t.ulaeste, t.ulaeste === 1 ? "mail" : "mails");
}

/* ---------- CRM-data fra Supabase ----------
   Alt fra databasen hentes samlet, fordi det er hurtigt og samme sted. */
async function hentCrm(){
  kildeStatus("Supabase", "henter");
  const start = ugeStart();
  const slut = new Date(start); slut.setDate(slut.getDate() + 7);
  const idag = lokalDato();

  const [uge, opg, gaaet, folk, fdag] = await Promise.all([
    db.from("moeder").select("*, personer(navn), kunder(navn)")
      .gte("start_tid", start.toISOString()).lt("start_tid", slut.toISOString())
      .order("start_tid"),
    db.from("opgaver").select("*, kunder(navn), leads(titel)")
      .eq("afsluttet", false).lte("forfalder_dato", idag).order("forfalder_dato"),
    db.from("v_skal_foelges_op").select("*"),
    db.from("personer").select("id", {count: "exact", head: true}).eq("privat", false),
    db.from("v_foedselsdage").select("*").lte("dage_til", 30).order("dage_til").limit(6)
  ]);

  const fejl = [uge, opg, gaaet, folk, fdag].find(r => r.error);
  kildeStatus("Supabase", fejl ? fejl.error.message : "ok");

  ugeMoeder = uge.data || [];
  crmOpgaver = opg.data || [];
  crmGaaet = gaaet.data || [];

  forsideTal.moederCrm = ugeMoeder.length;
  forsideTal.opgaverCrm = crmOpgaver.length;
  forsideTal.kontakter = folk.error ? null : (folk.count || 0);
  opdaterNaeste();

  tegnStats();
  tegnUge();
  tegnHandling();
  tegnFoedselsdage(fdag.data || [], fdag.error);

  forsideHilsen = {
    moeder: ugeMoeder.filter(m => lokalDato(m.start_tid) === idag).length,
    handling: crmOpgaver.length + crmGaaet.length,
    foedselar: (fdag.data || []).filter(f => f.dage_til === 0).map(f => f.navn.split(" ")[0])
  };
  if (hilsVedLogin){
    hilsVedLogin = false;
    hils(forsideHilsen);
  }
}

// Næste møde i ugen, uanset om det står i CRM eller Google.
function opdaterNaeste(){
  const nu = new Date();
  const alle = [
    ...ugeMoeder.map(m => new Date(m.start_tid)),
    ...gKalender.filter(a => !a.heldags).map(a => new Date(a.start))
  ].filter(d => d > nu).sort((a, b) => a - b);
  forsideTal.naeste = alle.length
    ? `${DAGE[alle[0].getDay()].slice(0, 3)} ${klokken(alle[0])}` : null;
}

/* ---------- Uge ----------
   Tegnes to gange: først med CRM-møderne, igen når Google-kalenderen
   er hentet gennem /api/indbakke. */
function tegnUge(){
  const boks = $("#uge");
  if (!boks) return;
  const idag = lokalDato();
  const start = ugeStart();
  let h = "";

  for (let i = 0; i < 5; i++){
    const d = new Date(start); d.setDate(d.getDate() + i);
    const key = lokalDato(d);
    const poster = [
      ...ugeMoeder.filter(m => lokalDato(m.start_tid) === key).map(m => ({
        tid: m.start_tid,
        tekst: m.personer?.navn ? `${m.titel} · ${m.personer.navn}` : m.titel,
        slags: "crm"
      })),
      ...gKalender.filter(a => lokalDato(a.start) === key).map(a => ({
        tid: a.start,
        tekst: a.titel + (a.sted ? " · " + a.sted : ""),
        heldags: a.heldags,
        slags: "google"
      }))
    ].sort((a, b) => (b.heldags ? 1 : 0) - (a.heldags ? 1 : 0) || String(a.tid).localeCompare(String(b.tid)));

    const vis = poster.slice(0, 3);
    h += `<div class="day${key === idag ? " day--today" : ""}">
      <div class="day-dow">${key === idag ? "I dag" : DAGE[d.getDay()].slice(0, 3)}</div>
      <div class="day-num">${d.getDate()}</div>
      ${vis.map(x => `<div class="day-event day-event--${x.slags}">
        <div class="day-event-time">${x.heldags ? "Hele dagen" : klokken(x.tid)}</div>
        <div class="day-event-text">${sikker(x.tekst)}</div>
      </div>`).join("")}
      ${poster.length > vis.length ? `<div class="day-mere">+${poster.length - vis.length} mere</div>` : ""}
      ${poster.length ? "" : `<div class="day-empty">fri</div>`}
    </div>`;
  }
  boks.innerHTML = h;
}

/* ---------- Kræver handling ----------
   CRM-opgaver, tilbud i stå og Todoist. CRM og Todoist får hver deres
   pladser, så den ene aldrig skubber den anden ud. */
const HANDLING_PLADSER = 6;

function tegnHandling(){
  const boks = $("#handling");
  if (!boks) return;
  const idag = lokalDato();

  const crm = [
    ...crmOpgaver.map(t => ({ titel: t.titel, meta: ["CRM", t.kunder?.navn || t.leads?.titel].filter(Boolean).join(" · "),
      dato: t.forfalder_dato, sent: t.forfalder_dato < idag, id: t.id, slags: "opgave" })),
    ...crmGaaet.map(g => ({ titel: g.titel, meta: ["Tilbud i stå", g.kunde].filter(Boolean).join(" · "),
      dato: g.senest_tilbud_sendt, id: g.id, slags: "tilbud" }))
  ];
  const todo = todoistOpgaver.map(o => ({ titel: o.titel, meta: "Todoist", dato: o.dato,
    sent: o.forfalden, link: o.link, slags: "todoist" }));

  const crmPladser = Math.max(3, HANDLING_PLADSER - todo.length);
  const vis = [...crm.slice(0, crmPladser),
               ...todo.slice(0, HANDLING_PLADSER - Math.min(crm.length, crmPladser))];
  const ialt = crm.length + todo.length;
  const henter = forsideTal.opgaverCrm == null;

  const raekke = x => {
    const pill = x.dato ? `<span class="pill${x.sent ? " pill--sent" : ""}">${kort(x.dato)}</span>` : "";
    const krop = `<div class="task-body">
        <div class="task-title">${sikker(x.titel)}</div>
        <div class="task-meta">${sikker(x.meta)}</div>
      </div>${pill}`;
    if (x.slags === "opgave") return `<li class="task">
      <button type="button" class="task-check" title="Markér som færdig" aria-label="Markér som færdig" onclick="lukOpgave('${sikker(x.id)}')"></button>${krop}</li>`;
    if (x.slags === "todoist") return `<li><a class="task" href="${sikker(x.link)}" target="_blank" rel="noopener">
      <span class="task-check task-check--ikon" aria-hidden="true"></span>${krop}</a></li>`;
    return `<li><a class="task" href="#" onclick="aabnLead('${sikker(x.id)}');return false">
      <span class="task-check task-check--ikon" aria-hidden="true"></span>${krop}</a></li>`;
  };

  boks.innerHTML = `
    <header class="card-head">
      <h2>Kræver handling</h2>
      <button type="button" class="link" onclick="visFane('opfoelgning')">${ialt > vis.length ? `Se alle ${ialt} →` : "Se alle →"}</button>
    </header>
    ${henter ? skelet(3)
      : vis.length ? `<ul class="tasks">${vis.map(raekke).join("")}</ul>`
      : `<p class="tom">Intet forfaldent. Sjældent syn.</p>`}
    ${todoistFejl ? `<div class="card-foot fejltekst">Todoist: ${sikker(todoistFejl)}</div>` : ""}`;
}

async function hentTodoist(){
  kildeStatus("Todoist", "henter");
  try {
    const r = await apiHent("/api/todoist");
    const data = await r.json();
    todoistOpgaver = data.opgaver || [];
    todoistFejl = data.fejl || "";
  } catch {
    todoistOpgaver = [];
    todoistFejl = "ingen forbindelse";
  }
  // Vises både i chippen og i kortets fod, så en død forbindelse ikke er tavs.
  kildeStatus("Todoist", todoistFejl || "ok");
  forsideTal.todoist = todoistOpgaver.length;
  tegnStats();
  tegnHandling();
}

/* ---------- Ulæst post (gennem /api/indbakke) ----------
   Samme kald giver også Google-kalenderen til ugekortet. */
async function hentIndbakke(){
  kildeStatus("Gmail", "henter");
  try {
    // Kendte afsendere: både privat og arbejdsmail på alle i kartoteket,
    // så mails fra kunder får virksomhedens navn på.
    const [{ data: p }, { data: a }, r] = await Promise.all([
      db.from("personer").select("navn,email"),
      db.from("ansaettelser").select("email_arbejde, personer(navn), kunder(navn)"),
      apiHent("/api/indbakke")
    ]);
    const kendte = new Map();
    (p || []).forEach(x => x.email && kendte.set(x.email.toLowerCase(), {navn: x.navn, hvor: ""}));
    (a || []).forEach(x => x.email_arbejde && kendte.set(x.email_arbejde.toLowerCase(),
      {navn: x.personer?.navn || "", hvor: x.kunder?.navn || ""}));

    const data = await r.json();
    gKalender = data.aftaler || [];
    postCache = (data.poster || []).map(m => {
      const k = kendte.get((m.email || "").toLowerCase());
      return k ? {...m, hvor: k.hvor, navn: k.navn || m.navn} : m;
    });

    if (data.fejl && !postCache.length){
      kildeStatus("Gmail", data.fejl);
      $("#post") && ($("#post").innerHTML = `<p class="fejltekst">${sikker(
        data.fejl === "mangler opsætning"
          ? "Ikke koblet til. GMAIL_URL og GMAIL_NOEGLE mangler i Cloudflare."
          : "Kunne ikke hente post: " + data.fejl)}</p>`);
    } else {
      kildeStatus("Gmail", "ok");
      forsideTal.ulaeste = data.ulaeste ?? postCache.length;
      visPost();
    }

    forsideTal.moederGoogle = gKalender.filter(x => !x.heldags).length;
    opdaterNaeste();
    tegnStats();
    tegnUge();
  } catch {
    kildeStatus("Gmail", "ingen forbindelse");
    $("#post") && ($("#post").innerHTML = `<p class="fejltekst">Kunne ikke hente post lige nu.</p>`);
  }
}

function visPost(){
  const boks = $("#post");
  if (!boks) return;
  const poster = postCache || [];
  const antal = $("#post-antal");
  antal.hidden = !forsideTal.ulaeste;
  antal.textContent = forsideTal.ulaeste || "";

  if (!poster.length) return (boks.innerHTML = `<p class="muted">Indbakken er tom. Nyd det.</p>`);
  boks.innerHTML = `<div class="list">${poster.slice(0, 6).map(m => `
    <a href="${sikker(m.link)}" target="_blank" rel="noopener" title="${sikker(m.uddrag || "")}">
      <div class="list-titel">
        <div class="afkort">${sikker(m.navn || m.email)}</div>
        <div class="muted small afkort">${sikker(m.emne || "(intet emne)")}</div>
      </div>
      <div class="list-hoejre">
        ${m.hvor ? `<span class="pill pill--graa">${sikker(m.hvor)}</span>` : ""}
        <span class="muted">${kort(m.dato)}</span>
      </div>
    </a>`).join("")}</div>`;
}

/* ============================================================
   7. WEBSITES (gennem /api/analytics)
   Ét kald til GA4 og ét til Search Console for alle sites i SITES.
   Hvert kort tegnes ud fra hvad der er kommet, så et site uden GA4
   stadig viser sine søgeord.
   ============================================================ */
async function hentAnalytik(){
  analytik = { ga4: null, gsc: null, ga4Fejl: "", gscFejl: "", hentet: false };
  const ider = SITES.map(s => s.ga4PropertyId).filter(Boolean);
  const soeg = Object.fromEntries(SITES.filter(s => s.gscProperty)
    .map(s => [s.gscProperty, s.trackedQueries || []]));

  kildeStatus("Analytics", "henter");
  const hent = async (sti) => {
    try {
      const r = await apiHent(sti);
      const data = await r.json();
      // Uden "sites" i svaret er det den gamle script-version, der kun
      // kender indbakken og svarer med den uanset hvad man spørger om.
      if (!data.sites) return { fejl: data.fejl || "Apps Script kender ikke v=ga4/gsc endnu. Er den nye version deployet?" };
      return data;
    } catch {
      return { fejl: "ingen forbindelse" };
    }
  };

  const [ga4, gsc] = await Promise.all([
    ider.length ? hent(`/api/analytics?v=ga4&ider=${encodeURIComponent(ider.join(","))}`) : { sites: {} },
    hent(`/api/analytics?v=gsc&soeg=${encodeURIComponent(JSON.stringify(soeg))}`)
  ]);

  analytik = {
    ga4: ga4.sites || null, gsc: gsc.sites || null,
    ga4Fejl: ga4.fejl || "", gscFejl: gsc.fejl || "", hentet: true
  };
  // Fejl på et enkelt site tæller også, så chippen ikke siger "Alt hentet"
  // mens et kort står med en fejl.
  const siteFejl = [...Object.values(analytik.ga4 || {}), ...Object.values(analytik.gsc || {})]
    .find(x => x && x.fejl);
  kildeStatus("Analytics", analytik.ga4Fejl || analytik.gscFejl || siteFejl?.fejl || "ok");
  SITES.forEach(tegnSite);
}

// Summen af de events config siger er kontakter.
function kontakterFra(events, keyEvents){
  if (!keyEvents?.length) return null;
  return keyEvents.reduce((s, k) => s + Number(events?.[k] || 0), 0);
}

// Daglige tal til et SVG-sti i viewBox 600×140. Bunden er y=130 og
// toppen y=10, så linjen aldrig rører kanten.
function grafSti(vaerdier){
  const maks = Math.max(1, ...vaerdier);
  const n = vaerdier.length;
  const pkt = vaerdier.map((v, i) => [n === 1 ? 600 : i / (n - 1) * 600, 130 - v / maks * 120]);
  const linje = pkt.map((p, i) => `${i ? "L" : "M"} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  return { linje, flade: `${linje} L 600 130 L 0 130 Z`, slutY: pkt[n - 1][1] };
}

function tegnSite(site){
  const boks = $("#site-" + site.slug);
  if (!boks) return;

  const ga4 = site.ga4PropertyId ? analytik.ga4?.[site.ga4PropertyId] : null;
  const gsc = site.gscProperty ? analytik.gsc?.[site.gscProperty] : null;
  const henter = !analytik.hentet;
  const harGa4 = !!(ga4 && !ga4.fejl && ga4.dage);

  // Hvad der står i grafen, når der ikke er en graf.
  const ga4Besked = !site.ga4PropertyId
    ? `GA4 ikke konfigureret. Sæt <code>ga4PropertyId</code> i SITES.`
    : henter ? ""
    : analytik.ga4Fejl ? `GA4: ${sikker(analytik.ga4Fejl)}`
    : ga4?.fejl ? `GA4 svarede: ${sikker(ga4.fejl)}`
    : !harGa4 ? "Ingen GA4-data." : "";

  // Tal i hovedet: besøgende og ændring mod de 30 dage før.
  let metrik;
  if (harGa4){
    const delta = ga4.forrigeBesoegende ? (ga4.besoegende - ga4.forrigeBesoegende) / ga4.forrigeBesoegende : null;
    metrik = `<span class="chart-value">${tal(ga4.besoegende)}</span>
      ${delta == null ? "" : `<span class="chart-delta chart-delta--${delta >= 0 ? "up" : "down"}"
        title="Mod de 30 dage før: ${tal(ga4.forrigeBesoegende)}">${delta >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(delta * 100))}%</span>`}
      <span class="chart-caption">besøgende · sidste 30 dage</span>`;
  } else if (henter && site.ga4PropertyId){
    metrik = `<span class="chart-value skel">000</span><span class="chart-caption">besøgende · sidste 30 dage</span>`;
  } else {
    metrik = `<span class="chart-value">–</span>
      <span class="chart-caption">${site.ga4PropertyId ? "besøgende · sidste 30 dage" : "GA4 ikke konfigureret"}</span>`;
  }

  // Grafen. Uden data står gitterlinjerne alene med en besked over.
  let plot = "", slutPrik = "", xakse = "<span></span><span></span><span>I dag</span>";
  const gid = "g-" + site.slug.replace(/[^a-z0-9-]/gi, "");
  if (harGa4){
    const dage = ga4.dage;
    const sti = grafSti(dage.map(d => d.sessions));
    plot = `<path class="chart-area" d="${sti.flade}" fill="url(#${gid})"/>
      <path class="chart-line" d="${sti.linje}"/>`;
    const midt = dage[Math.floor((dage.length - 1) / 2)];
    xakse = `<span>${kort(dage[0].dato)}</span><span>${kort(midt.dato)}</span><span>I dag</span>`;
    slutPrik = `<span class="chart-end-dot" style="--end-y: ${(sti.slutY / 140 * 100).toFixed(2)}%;"></span>`;
  }

  const events = harGa4 ? ga4.events : null;
  const kontakter = harGa4 ? kontakterFra(events, site.keyEvents) : null;
  const substat = (label, indhold, tekst = false) => `<div class="substat">
    <div class="substat-label">${label}</div>
    <div class="${tekst ? "substat-text" : "substat-value"}${henter && site.ga4PropertyId ? " skel" : ""}">${indhold}</div></div>`;

  boks.innerHTML = `
    <header class="chart-head">
      <div>
        <div class="chart-title">
          <span class="chart-dot"></span>
          <h2>${sikker(site.navn)}</h2>
          <span class="tag">${sikker(site.tag)}</span>
        </div>
        <div class="chart-metric">${metrik}</div>
      </div>
      <div class="segmented" role="group" aria-label="Periode">
        <button type="button" class="is-active">30d</button>
        <button type="button" aria-disabled="true" title="Kræver længere perioder fra Apps Scriptet">90d</button>
        <button type="button" aria-disabled="true" title="Kræver længere perioder fra Apps Scriptet">År</button>
      </div>
    </header>

    <div class="chart-plot${harGa4 ? "" : " chart-plot--tom"}" data-slug="${sikker(site.slug)}">
      <svg viewBox="0 0 600 140" preserveAspectRatio="none" role="img" aria-label="Sessions per dag, sidste 30 dage">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line class="grid-line" x1="0" y1="10" x2="600" y2="10"/>
        <line class="grid-line" x1="0" y1="70" x2="600" y2="70"/>
        <line class="grid-line" x1="0" y1="130" x2="600" y2="130"/>
        ${plot}
      </svg>
      ${slutPrik}
      ${ga4Besked ? `<div class="chart-tom">${ga4Besked}</div>` : ""}
    </div>
    <div class="chart-xaxis">${xakse}</div>

    <footer class="chart-substats">
      ${substat("Kontakter", kontakter == null ? "–" : tal(kontakter))}
      ${substat("Topside", harGa4 && ga4.topside ? sikker(ga4.topside) : "–", true)}
      ${substat("Topkilde", harGa4 && ga4.topkilde ? sikker(ga4.topkilde) : "–", true)}
    </footer>

    ${gscBlok(site, gsc, henter)}`;

  if (harGa4) grafHover(boks.querySelector(".chart-plot"), ga4.dage);
  // Kontakter-tallet forklarer sig selv på hover: hvilke events det er.
  const k = boks.querySelector(".substat");
  if (k) k.title = site.keyEvents.length ? "Key events: " + site.keyEvents.join(", ") : "Ingen key events i SITES";
}

function gscBlok(site, gsc, henter){
  if (!site.gscProperty) return "";
  if (henter) return `<div class="gsc">${skelet(2)}</div>`;
  if (analytik.gscFejl) return `<div class="gsc"><p class="fejltekst">Search Console: ${sikker(analytik.gscFejl)}</p></div>`;
  if (!gsc) return `<div class="gsc"><p class="muted">Ingen Search Console-data.</p></div>`;
  if (gsc.fejl) return `<div class="gsc"><p class="fejltekst">Search Console svarede: ${sikker(gsc.fejl)}</p></div>`;

  const top = (gsc.top || [])[0];
  const pos = p => p == null ? "–" : decimal(p);
  return `<div class="gsc">
    <div class="gsc-head">
      <span>Search Console · 28 dage til ${kort(gsc.til)}</span>
      <span>${tal(gsc.klik)} klik · ${tal(gsc.visninger)} visninger</span>
    </div>
    ${top ? `<p class="gsc-note">Top søgeord: <b>${sikker(top.soegeord)}</b>: ${tal(top.klik)} klik, pos ${pos(top.position)}</p>`
          : `<p class="gsc-note">Ingen søgeord med klik i perioden.</p>`}
    ${(gsc.sporede || []).length ? `<table class="gsc-tabel">
      <tr><th>Sporede søgeord</th><th>Klik</th><th>Position</th></tr>
      ${gsc.sporede.map(q => `<tr>
        <td>${sikker(q.soegeord)}</td>
        <td class="tal">${tal(q.klik)}</td>
        <td class="tal">${pos(q.position)}</td>
      </tr>`).join("")}
    </table>` : ""}
  </div>`;
}

// Viser dag og antal sessions når musen er over grafen.
function grafHover(plot, dage){
  if (!plot) return;
  const streg = document.createElement("div");
  const tip = document.createElement("div");
  streg.className = "chart-hover"; tip.className = "chart-tip";
  streg.hidden = tip.hidden = true;
  plot.append(streg, tip);
  plot.onmousemove = e => {
    const r = plot.getBoundingClientRect();
    const i = Math.max(0, Math.min(dage.length - 1, Math.round((e.clientX - r.left) / r.width * (dage.length - 1))));
    const x = dage.length === 1 ? r.width : i / (dage.length - 1) * r.width;
    streg.style.left = tip.style.left = x + "px";
    tip.textContent = `${kort(dage[i].dato)} · ${tal(dage[i].sessions)} sessions`;
    streg.hidden = tip.hidden = false;
  };
  plot.onmouseleave = () => { streg.hidden = tip.hidden = true; };
}

async function visPipeline(){
  henter();
  const { data, error } = await db.from("v_pipeline")
    .select("*").order("forventet_lukkedato", {nullsFirst: false});
  if (error) return visFejl(error);

  const leads = data || [];
  const vaerdi = liste => liste.reduce((s, l) => s + Number(l.estimeret_vaerdi || 0), 0);
  const stoerste = Math.max(1, ...TRIN.map(([k]) => vaerdi(leads.filter(l => l.status === k))));

  let h = sideHoved("Pipeline",
    leads.length ? `${leads.length} åbne ${leads.length === 1 ? "sag" : "sager"} · ${kr(vaerdi(leads)) || "0 kr."}` : "",
    `<button type="button" class="btn-primary" onclick="nyKunde()">+ Ny kunde</button>`);

  if (!leads.length){
    h += `<section class="card"><p class="tom">Ingen åbne sager. Opret en kunde, og hæng den første sag på.</p></section>`;
    return ($("#indhold").innerHTML = h);
  }

  for (const [koden, navn] of TRIN){
    const i = leads.filter(l => l.status === koden);
    if (!i.length) continue;
    const sum = vaerdi(i);
    h += `<section class="card trin">
      <div class="trin-head">
        <h2>${navn}</h2>
        <span class="pill pill--graa">${i.length}</span>
        <span class="trin-sum">${kr(sum) || "0 kr."}</span>
      </div>
      <div class="bjaelke"><i style="width:${Math.max(sum ? 2 : 0, Math.round(sum / stoerste * 100))}%"></i></div>
      ${i.map(leadKort).join("")}
    </section>`;
  }
  $("#indhold").innerHTML = h;
}

function leadKort(l){
  const forsinket = l.forventet_lukkedato && l.forventet_lukkedato < lokalDato();
  return `<article class="emne klik" onclick="aabnLead('${sikker(l.id)}')">
    <div class="emne-top">

async function visKunder(soeg = ""){
  if (!soeg) henter();
  let q = db.from("kunder")
    .select("*, virksomheder(navn), ansaettelser(titel,nuvaerende,personer(navn)), leads(id,status)")
    .order("navn");
  // Kommaer og parenteser ville bryde Supabases or-filter, så de fjernes.
  const s = soeg.replace(/[,()]/g, " ").trim();
  if (s) q = q.or(`navn.ilike.%${s}%,by.ilike.%${s}%,email.ilike.%${s}%`);
  const { data, error } = await q;
  if (error) return visFejl(error);

  let h = sideHoved("Kunder", `${data.length} ${data.length === 1 ? "kunde" : "kunder"}`,
    `<button type="button" class="btn-primary" onclick="nyKunde()">+ Ny kunde</button>`) +
    `<input id="soeg" class="soeg" placeholder="Søg på navn, by eller mail" value="${sikker(soeg)}">`;

  h += data.length ? data.map(k => {
    const aabne = (k.leads || []).filter(l => !["vundet", "tabt"].includes(l.status)).length;
    return `<article class="emne klik" onclick="aabnKunde('${sikker(k.id)}')">
      <div class="emne-top">
        <div>
          <div class="emne-titel">${sikker(k.navn)}</div>
          <div class="emne-under">${[k.branche, ansatAf(k)?.personer?.navn].filter(Boolean).map(sikker).join(" · ")}</div>
        </div>
        ${virksomhedPill(k.virksomheder?.navn)}
      </div>
      ${aabne ? `<div class="emne-fod"><span>${aabne} åben ${aabne === 1 ? "sag" : "sager"}</span></div>` : ""}
    </article>`;
  }).join("")
  : `<section class="card"><p class="tom">${soeg ? "Ingen kunder matcher søgningen." : "Ingen kunder endnu. Opret den første."}</p></section>`;

  $("#indhold").innerHTML = h;
  soegefelt("#soeg", visKunder);
}

// Søgning med en lille pause, så der ikke hentes for hvert tastetryk.
// Fanen tegnes forfra, så markøren sættes tilbage i feltet bagefter.
function soegefelt(id, vis){
  const felt = $(id);
  let timer;
  felt.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const v = felt.value;
      await vis(v);
      const nyt = $(id);
      nyt.focus();
      nyt.setSelectionRange(v.length, v.length);
    }, 300);
  };
}

  // Et sendt tilbud flytter sagen frem i pipelinen af sig selv.
  await db.from("leads").update({status: "tilbud_sendt"}).eq("id", leadId);
  aabnLead(leadId);
}

async function gemOpgave(leadId, kundeId){
  const titel = $("#o-titel").value.trim();
  const d = $("#o-dato").value;
  if (!titel || !d) return;
  const { data: bruger } = await db.auth.getUser();
  await db.from("opgaver").insert({
    lead_id: leadId,
    kunde_id: kundeId || null,
    titel,
    forfalder_dato: d,
    ansvarlig_id: bruger?.user?.id || null
  });
  aabnLead(leadId);
  taelOpfoelgning();
}

async function gemAktivitet(leadId, kundeId){
  const tekst = $("#a-tekst").value.trim();
  // aktiviteter kræver en kunde i databasen.
  if (!tekst || !kundeId) return;
  const { data: bruger } = await db.auth.getUser();
  await db.from("aktiviteter").insert({
    kunde_id: kundeId,
    lead_id: leadId,
    type: $("#a-type").value,
    beskrivelse: tekst,
    bruger_id: bruger?.user?.id || null
  });
  aabnLead(leadId);
}

/* ============================================================
   10. OPFØLGNING
   Opgaverne hentes én gang og filtreres i browseren, så et klik
   på Alle / I dag / Forfaldne ikke koster et netværkskald.
   ============================================================ */
let opgaveCache = [];
let opgaveFilter = "alle";

async function visOpfoelgning(){
  henter();
  const [gaaet, opgaver] = await Promise.all([
    db.from("v_skal_foelges_op").select("*"),
    db.from("opgaver").select("*, kunder(navn), leads(titel)")
      .eq("afsluttet", false).order("forfalder_dato")
  ]);
  if (gaaet.error) return visFejl(gaaet.error);
  if (opgaver.error) return visFejl(opgaver.error);

  opgaveCache = opgaver.data || [];
  const g = gaaet.data || [];
  const forfaldne = opgaveCache.filter(t => t.forfalder_dato < lokalDato()).length;
  const stat = (label, vaerdi, fremhaev) => `<article class="stat">
    <div class="stat-label">${label}</div>
    <div class="stat-row"><div class="stat-value${fremhaev ? " stat-value--accent" : ""}">${vaerdi}</div></div>
    ${fremhaev ? `<span class="stat-marker" aria-hidden="true"></span>` : ""}
  </article>`;

  $("#indhold").innerHTML = sideHoved("Opfølgning", "Hvad der venter.",
    `<button type="button" class="btn-primary" onclick="nyOpgave()">+ Ny opgave</button>`) + `
    <section class="stats stats--tre">
      ${stat("Åbne opgaver", opgaveCache.length)}
      ${stat("Forfaldne", forfaldne, forfaldne > 0)}
      ${stat("Tilbud i stå", g.length, g.length > 0)}
    </section>
    <div class="grid">
      <section class="card">
        <header class="card-head"><h2>Opgaver</h2><div class="segmented" id="opg-filter"></div></header>
        <div id="opg-liste"></div>
      </section>
      <section class="card">
        <header class="card-head"><h2>Tilbud der er gået i stå</h2></header>
        <p class="hjaelp" style="margin:-8px 0 12px">Sendt for mere end 10 dage siden og ikke rørt i 7.</p>
        ${g.length ? g.map(leadKort).join("") : `<p class="tom">Ingen tilbud ligger og samler støv.</p>`}
      </section>
    </div>`;

  tegnOpgaver();
  taelOpfoelgning();
}

function tegnOpgaver(){
  const idag = lokalDato();
  const filtre = {
    alle:      ["Alle",      () => true],
    idag:      ["I dag",     t => t.forfalder_dato === idag],
    forfaldne: ["Forfaldne", t => t.forfalder_dato < idag]
  };
  $("#opg-filter").innerHTML = Object.entries(filtre).map(([k, [navn, f]]) =>
    `<button type="button" class="${k === opgaveFilter ? "is-active" : ""}"
      onclick="opgaveFilter='${k}';tegnOpgaver()">${navn} · ${opgaveCache.filter(f).length}</button>`).join("");

  const vis = opgaveCache.filter(filtre[opgaveFilter][1]);
  $("#opg-liste").innerHTML = vis.length ? `<ul class="tasks">${vis.map(t => `<li class="task">
      <button type="button" class="task-check" title="Markér som færdig" aria-label="Markér som færdig" onclick="lukOpgave('${sikker(t.id)}')"></button>
      <div class="task-body">
        <div class="task-title">${sikker(t.titel)}</div>
        <div class="task-meta">${sikker(t.kunder?.navn || t.leads?.titel || "")}</div>
      </div>
      <span class="pill${t.forfalder_dato < idag ? " pill--sent" : ""}">${kort(t.forfalder_dato)}</span>
    </li>`).join("")}</ul>`
    : `<p class="tom">${opgaveFilter === "alle" ? "Ingen opgaver på bordet." : "Intet i denne visning."}</p>`;
}

async function visKontakter(soeg = ""){
  if (!soeg) henter();
  let q = db.from("v_kontakter").select("*").order("navn");
  const s = soeg.replace(/[,()]/g, " ").trim();
  if (s) q = q.or(`navn.ilike.%${s}%,virksomhed.ilike.%${s}%,titel.ilike.%${s}%`);
  const { data, error } = await q;
  if (error) return visFejl(error);

  let h = sideHoved("Kontakter", `${data.length} i netværket`,
    `<button type="button" class="btn-primary" onclick="nyPerson()">+ Ny kontakt</button>`) +
    `<input id="soeg-k" class="soeg" placeholder="Søg på navn, virksomhed eller titel" value="${sikker(soeg)}">`;

  h += data.length ? data.map(c => `<article class="emne klik" onclick="aabnPerson('${sikker(c.id)}')">
      <div class="emne-top">
        <div>
          <div class="emne-titel">${sikker(c.navn)}</div>
          <div class="emne-under">${[c.titel, c.virksomhed].filter(Boolean).map(sikker).join(" · ") || "Ingen aktuel arbejdsplads"}</div>
        </div>
        ${c.virksomhed ? (c.branche ? `<span class="pill pill--graa">${sikker(c.branche)}</span>` : "")
          : `<span class="pill pill--sent">Mellem job</span>`}
      </div>
    </article>`).join("")
    : `<section class="card"><p class="tom">${soeg ? "Ingen kontakter matcher." : "Ingen kontakter endnu."}</p></section>`;

  $("#indhold").innerHTML = h;
  soegefelt("#soeg-k", visKontakter);
}

/* ---------- fødselsdag og relation ----------
   Året 1900 betyder "året kendes ikke". En datoboks kan ikke tage
   imod en dato uden år, og et falsk år er bedre end to felter. */
const RELATIONER = ["kunde", "kollega", "ven", "familie", "netværk"];

function fdagTekst(d){
  const x = new Date(d);
  return x.toLocaleDateString("da-DK", x.getFullYear() > 1900
    ? {day: "numeric", month: "long", year: "numeric"} : {day: "numeric", month: "long"});
}

function personligeFelter(p){
  return `<div class="par">
      <div><label for="p-fdag">Fødselsdag</label>
        <input id="p-fdag" type="date" value="${sikker(p.foedselsdag || "")}"></div>
      <div><label for="p-rel">Relation</label>
        <input id="p-rel" list="relationer" value="${sikker(p.relation || "")}" placeholder="kunde, ven, …">
        <datalist id="relationer">${RELATIONER.map(r => `<option value="${r}">`).join("")}</datalist></div>
    </div>
    <p class="hjaelp">Kender du ikke året, så skriv 1900.</p>`;
}

function personligeVaerdier(){
  return {
    foedselsdag: $("#p-fdag").value || null,
    relation: $("#p-rel").value.trim() || null
  };
}

/* ---------- kontaktkort ---------- */

    (b.nuvaerende - a.nuvaerende) || String(b.fra_dato || "").localeCompare(String(a.fra_dato || "")));
  const nu = ans.find(a => a.nuvaerende);
  const foer = ans.filter(a => !a.nuvaerende);

  const pid = sikker(p.id);

  aabnPanel("Kontakt", sikker(p.navn),

    <div class="emne">
      ${p.mobil ? `<div><a href="tel:${sikker(p.mobil)}">${sikker(p.mobil)}</a></div>` : ""}
      ${nu?.email_arbejde ? `<div><a href="mailto:${sikker(nu.email_arbejde)}">${sikker(nu.email_arbejde)}</a></div>` : ""}
      ${p.email ? `<div><a href="mailto:${sikker(p.email)}">${sikker(p.email)}</a> <span class="muted small">privat</span></div>` : ""}
      ${p.linkedin ? `<div><a href="${webUrl(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a></div>` : ""}
      ${p.foedselsdag ? `<div>Fødselsdag ${fdagTekst(p.foedselsdag)}</div>` : ""}
      ${p.relation ? `<div class="emne-fod"><span class="pill pill--graa">${sikker(p.relation)}</span></div>` : ""}
      ${p.noter ? `<p>${sikker(p.noter)}</p>` : ""}
    </div>
    <button type="button" class="btn-sekundaer" onclick="retPerson('${pid}')">Ret oplysninger</button>

    <div class="afsnit">
      <h4>Arbejdsplads</h4>
      ${nu ? `<div class="emne klik" onclick="aabnKunde('${sikker(nu.kunder?.id)}')">
          <div class="emne-titel">${sikker(nu.kunder?.navn || "")}</div>
          <div class="emne-under">${sikker(nu.titel || "")}${nu.fra_dato ? " · siden " + dato(nu.fra_dato) : ""}</div>

      ${foer.length ? `<div style="margin-top:16px">${foer.map(a => `<div class="log">
          <div>${sikker(a.kunder?.navn || "")}${a.titel ? ", " + sikker(a.titel) : ""}</div>
          <div class="muted">${a.fra_dato ? dato(a.fra_dato) : "?"} til ${a.til_dato ? dato(a.til_dato) : "?"}</div>
        </div>`).join("")}</div>` : ""}
    </div>

    <div class="afsnit">
      <h4>Møder</h4>
      ${moeder.length ? moeder.map(mm => `<div class="emne">
        <div class="emne-top">
          <div>
            <div class="emne-titel">${sikker(mm.titel)}</div>
            <div class="emne-under">${dagNavn(mm.start_tid)} kl. ${klokken(mm.start_tid)}</div>
          </div>
          <span class="pill${mm.afholdt ? " pill--graa" : ""}">${mm.afholdt ? "Afholdt" : "Planlagt"}</span>

async function gemJob(personId){

/* ============================================================
   12. FØDSELSDAGE
   Familie og venner er personer med privat = true. De står her og
   på forsiden, men ikke i Kontakter. Forretningskontakter får deres
   fødselsdag på kontaktkortet og dukker også op her.
   ============================================================ */
async function visFoedselsdage(){
  henter();
  const { data, error } = await db.from("v_foedselsdage").select("*").order("dage_til");
  if (error) return visFejl(error);
  const alle = data || [];

  let h = sideHoved("Fødselsdage", "Grupperet efter måned.",
    `<button type="button" class="btn-primary" onclick="nyFoedselsdag()">+ Ny fødselsdag</button>`);

  if (!alle.length){
    h += `<section class="card"><p class="tom">Ingen fødselsdage endnu.</p></section>`;
    return ($("#indhold").innerHTML = h);
  }

  // Grupperet efter måneden for næste fødselsdag, så listen læses som en kalender.
  let sidste = "";
  h += `<section class="card">`;
  for (const f of alle){
    const n = new Date(f.naeste);
    const maaned = `${MAANEDER[n.getMonth()]} ${n.getFullYear()}`;
    if (maaned !== sidste){
      h += `<h4 class="overskrift">${maaned}</h4>`;
      sidste = maaned;
    }
    h += `<div class="fdag-raekke${f.dage_til === 0 ? " idag" : ""}" onclick="${f.privat ? "retFoedselsdag" : "aabnPerson"}('${sikker(f.id)}')">
      <div class="fdag-dato">${n.getDate()}</div>
      <div class="fdag-tekst">
        <div class="fdag-navn">${sikker(f.navn)}${f.fylder ? `, fylder ${sikker(f.fylder)}` : ""}</div>
        <div class="muted small">${[f.relation, f.virksomhed, f.privat ? "privat" : ""].filter(Boolean).map(sikker).join(" · ")}</div>
      </div>
      <div class="fdag-om">${f.dage_til === 0 ? `<span class="pill">I dag</span>`
        : f.dage_til === 1 ? "i morgen" : `om ${f.dage_til} dage`}</div>
    </div>`;
  }
  h += `</section>`;
  $("#indhold").innerHTML = h;
}

function foedselsdagFelter(p){
  return `<label for="p-navn">Navn</label>
    <input id="p-navn" value="${sikker(p.navn || "")}" placeholder="Fornavn Efternavn">
    ${personligeFelter(p)}
    <label for="p-noter">Noter</label>
    <textarea id="p-noter" placeholder="Gaveidéer, hvad de kan lide…">${sikker(p.noter || "")}</textarea>
    <label class="tjek"><input type="checkbox" id="p-forretning"${p.privat === false ? " checked" : ""}>
      Vis også under Kontakter</label>
    <div id="p-fejl"></div>`;
}

function nyFoedselsdag(){
  aabnPanel("Opret", "Ny fødselsdag", "", `
    ${foedselsdagFelter({ relation: "familie" })}
    <button type="button" class="btn-primary" onclick="gemFoedselsdag()">Gem fødselsdag</button>`);
  $("#p-navn").focus();
}

async function retFoedselsdag(id){
  const { data: p } = await db.from("personer").select("*").eq("id", id).single();
  if (!p) return;
  aabnPanel("Fødselsdag", sikker(p.navn), p.foedselsdag ? fdagTekst(p.foedselsdag) : "", `
    ${foedselsdagFelter(p)}
    <button type="button" class="btn-primary" onclick="gemFoedselsdag('${sikker(p.id)}')">Gem ændringer</button>
    <div class="afsnit">
      <button type="button" class="btn-fare" onclick="sletFoedselsdag('${sikker(p.id)}')">Slet</button>
    </div>`);

async function gemFoedselsdag(id){
  const navn = $("#p-navn").value.trim();
  const v = personligeVaerdier();
  if (!navn || !v.foedselsdag) return panelFejl("#p-fejl", "Der skal både navn og fødselsdag på.");
  const raekke = { navn, ...v, noter: $("#p-noter").value.trim() || null,
                   privat: !$("#p-forretning").checked };
  const { error } = id
    ? await db.from("personer").update(raekke).eq("id", id)
    : await db.from("personer").insert(raekke);
  if (error) return panelFejl("#p-fejl", error.message);
  lukPanel();
  visFane(location.hash === "#forside" ? "forside" : "foedselsdage");
}

async function sletFoedselsdag(id){
  if (!confirm("Slet personen helt? Det kan ikke fortrydes.")) return;
  const { error } = await db.from("personer").delete().eq("id", id);
  if (error) return panelFejl("#p-fejl", "Kunne ikke slette: " + error.message);
  lukPanel();
  visFane("foedselsdage");
}

/* ============================================================
   13. KALENDER
   Øverst denne uge med CRM og Google flettet (samme ugekort som på
   forsiden), derunder alle kommende CRM-møder og de seneste afholdte.
   ============================================================ */
async function visKalender(){
  henter();
  const nuISO = new Date().toISOString();
  const start = ugeStart();
  const slut = new Date(start); slut.setDate(slut.getDate() + 7);
  const [uge, kommende, afholdte] = await Promise.all([
    db.from("moeder").select("*, personer(navn), kunder(navn)")
      .gte("start_tid", start.toISOString()).lt("start_tid", slut.toISOString()).order("start_tid"),
    db.from("moeder").select("*, personer(navn), kunder(navn)")
      .gte("start_tid", nuISO).order("start_tid"),
    db.from("moeder").select("*, personer(navn), kunder(navn)")
      .lt("start_tid", nuISO).order("start_tid", {ascending: false}).limit(15)
  ]);
  if (kommende.error) return visFejl(kommende.error);

  ugeMoeder = uge.data || [];
  const k = kommende.data || [], a = afholdte.data || [];

  let h = sideHoved("Kalender", `${k.length} ${k.length === 1 ? "møde" : "møder"} forude i CRM`,
    `<button type="button" class="btn-primary" onclick="nytMoede()">+ Nyt møde</button>`) + `
    <section class="card" style="margin-bottom:14px">
      <header class="card-head"><h2>Uge ${ugeNr(new Date())}</h2><span class="muted small">CRM og Google-kalenderen</span></header>
      <div class="week" id="uge"></div>
    </section>
    <div class="grid">
      <section class="card"><header class="card-head"><h2>Kommende</h2></header>`;

  if (!k.length){
    h += `<p class="tom">Ingen møder i kalenderen.</p>`;
  } else {
    let sidsteDag = "";
    for (const m of k){
      const d = lokalDato(m.start_tid);
      if (d !== sidsteDag){
        h += `<h4 class="overskrift">${dagNavn(m.start_tid)}</h4>`;
        sidsteDag = d;
      }
      h += moedeKort(m);
    }
  }
  h += `</section>
      <section class="card"><header class="card-head"><h2>Afholdt</h2></header>
        ${a.length ? a.map(moedeKort).join("") : `<p class="tom">Intet afholdt endnu.</p>`}
      </section>
    </div>`;
  $("#indhold").innerHTML = h;
  tegnUge();

  // Google-kalenderen kommer med indbakken. Er den ikke hentet endnu
  // (fx ved genindlæsning direkte på fanen), hentes den her.
  if (!gKalender.length){
    try {
      const r = await apiHent("/api/indbakke");
      gKalender = (await r.json()).aftaler || [];
      tegnUge();
    } catch {}
  }
}

function moedeKort(m){
  const forbi = new Date(m.start_tid) < new Date();
  return `<article class="emne">
    <div class="emne-top">
      <div>
        <div class="emne-titel">${sikker(m.titel)}</div>
        <div class="emne-under">${[m.personer?.navn, m.kunder?.navn].filter(Boolean).map(sikker).join(" · ")}</div>
      </div>
      <div class="emne-vaerdi">${klokken(m.start_tid)}</div>
    </div>
    <div class="emne-fod">
      <span>${dagNavn(m.start_tid)}</span>
      ${m.sted ? `<span>${sikker(m.sted)}</span>` : ""}
      ${m.varighed_min ? `<span>${sikker(m.varighed_min)} min</span>` : ""}
      ${m.afholdt ? `<span class="pill pill--graa">Afholdt</span>`
        : forbi ? `<button type="button" class="btn-sekundaer" style="padding:4px 10px" onclick="afslutMoede('${sikker(m.id)}')">Registrér referat</button>` : ""}
    </div>
    ${m.referat ? `<p>${sikker(m.referat)}</p>` : ""}
  </article>`;
}

async function nytMoede(personId){
  const { data: folk } = await db.from("v_kontakter").select("id,navn,virksomhed,kunde_id").order("navn");
  const start = new Date(); start.setHours(start.getHours() + 1, 0, 0, 0);
  aabnPanel("Book", "Nyt møde", "", `
    <label for="m-titel">Hvad handler mødet om?</label>
    <input id="m-titel" placeholder="Statusmøde">
    <label for="m-person">Med hvem?</label>
    <select id="m-person">
      <option value="">Ingen kontakt valgt</option>
      ${(folk || []).map(f => `<option value="${sikker(f.id)}" data-kunde="${sikker(f.kunde_id || "")}"${f.id === personId ? " selected" : ""}>${sikker(f.navn)}${f.virksomhed ? ", " + sikker(f.virksomhed) : ""}</option>`).join("")}
    </select>
    <div class="par">
      <div><label for="m-start">Hvornår</label><input id="m-start" type="datetime-local" value="${lokalInput(start)}"></div>
      <div><label for="m-min">Varighed (min)</label><input id="m-min" type="number" value="60" inputmode="numeric"></div>
    </div>
    <label for="m-sted">Sted</label>
    <input id="m-sted" placeholder="Teams, deres kontor, frokost…">
    <div id="m-fejl"></div>
    <button type="button" class="btn-primary" onclick="gemMoede()">Gem møde</button>`);
  $("#m-titel").focus();
}

async function gemMoede(){
  const titel = $("#m-titel").value.trim();
  const start = $("#m-start").value;
  if (!titel || !start) return panelFejl("#m-fejl", "Mødet skal have en titel og et tidspunkt.");
  const valgt = $("#m-person").selectedOptions[0];
  const { error } = await db.from("moeder").insert({
    titel,
    person_id: $("#m-person").value || null,
    kunde_id: valgt?.dataset.kunde || null,
    start_tid: new Date(start).toISOString(),
    varighed_min: Number($("#m-min").value) || 60,
    sted: $("#m-sted").value.trim() || null
  });
  if (error) return panelFejl("#m-fejl", error.message);
  lukPanel();
  visFane("kalender");
}

async function afslutMoede(id){
  const { data: m } = await db.from("moeder").select("*").eq("id", id).single();
  if (!m) return;
  aabnPanel("Referat", sikker(m.titel), dagNavn(m.start_tid), `
    <label for="r-tekst">Hvad kom der ud af det?</label>
    <textarea id="r-tekst" style="min-height:150px">${sikker(m.referat || "")}</textarea>
    <button type="button" class="btn-primary" onclick="gemReferat('${sikker(id)}')">Gem og markér afholdt</button>`);
  $("#r-tekst").focus();
}

async function gemReferat(id){
  await db.from("moeder")
    .update({referat: $("#r-tekst").value.trim() || null, afholdt: true})
    .eq("id", id);
  lukPanel();
  visFane("kalender");
}

/* ============================================================
   15. HILSEN VED LOGIN
   Browserens egen stemme, så der hverken er nøgle eller server.
   Browsere må kun tale efter et klik, derfor kun ved selve login
   og ikke når en gemt session åbner siden. Én gang om dagen, så
   den ikke bliver til støj. "Lyd til" i sidebaren siger den med
   det samme, uden dagsgrænse.
   localStorage er per browser og kan være låst, deraf try/catch.
   ============================================================ */
function lydErSlaaet(){
  try { return localStorage.getItem("lyd") === "fra"; } catch { return false; }
}
function lydSlaaet(fra){
  try { localStorage.setItem("lyd", fra ? "fra" : "til"); } catch {}
  if (fra && window.speechSynthesis) speechSynthesis.cancel();
}
function visLydKnap(){
  $("#lyd").textContent = lydErSlaaet() ? "Lyd fra" : "Lyd til";
}
$("#lyd").onclick = () => {
  const varFra = lydErSlaaet();
  lydSlaaet(!varFra);
  visLydKnap();
  if (varFra) hils(forsideHilsen, true);
};
visLydKnap();

function hilsenTekst({ moeder, handling, foedselar }){
  const tal = n => ["no","one","two","three","four","five","six","seven","eight","nine","ten"][n] ?? String(n);
  const flertal = (n, ord) => `${tal(n)} ${ord}${n === 1 ? "" : "s"}`;
  const t = new Date().getHours();
  const dele = [t < 12 ? "Good morning, sir." : t < 18 ? "Good afternoon, sir." : "Good evening, sir."];

  if (moeder || handling){
    const s = [
      moeder ? `${flertal(moeder, "meeting")} today` : "",
      handling ? `${flertal(handling, "item")} requiring your attention` : ""
    ].filter(Boolean).join(", and ");
    dele.push(s[0].toUpperCase() + s.slice(1) + ".");
  } else {
    dele.push("Nothing on the calendar, and nothing overdue.");
  }
  if (foedselar.length === 1) dele.push(`It is ${foedselar[0]}'s birthday.`);
  if (foedselar.length > 1) dele.push(`Birthdays today: ${foedselar.join(" and ")}.`);
  return dele.join(" ");
}

// Stemmerne indlæses asynkront i nogle browsere, så vent kort på dem.
function stemmer(){
  const nu = speechSynthesis.getVoices();
  if (nu.length) return Promise.resolve(nu);
  return new Promise(ok => {
    speechSynthesis.onvoiceschanged = () => ok(speechSynthesis.getVoices());
    setTimeout(() => ok(speechSynthesis.getVoices()), 1000);
  });
}

async function hils(tal, tving = false){
  if (!window.speechSynthesis || lydErSlaaet()) return;
  const idag = lokalDato();
  try {
    if (!tving && localStorage.getItem("hilst") === idag) return;
    localStorage.setItem("hilst", idag);
  } catch {}
  // To klik lige efter hinanden skal ikke give to hilsner. Kun cancel
  // når den taler, for Safari sluger en speak() lige efter en cancel().
  if (speechSynthesis.speaking) speechSynthesis.cancel();

  const stemme = britiskMand(await stemmer());
  const s = new SpeechSynthesisUtterance(hilsenTekst(tal));
  if (stemme) s.voice = stemme;
  s.lang = "en-GB";
  s.rate = 0.95;
  s.pitch = 0.9;          // en anelse dybere, mere butler
  speechSynthesis.speak(s);
}

/* Britisk mandestemme. Navnene varierer mellem browsere: Safari siger
   "Daniel", Chrome "Google UK English Male", Edge "Microsoft Ryan Online".
   Derfor matches der på dele af navnet, i prioriteret rækkefølge.
   Første britiske stemme på listen er ofte en kvinde, så den bruges
   kun hvis navnet ikke afslører køn, og aldrig hvis det siger Female. */
const BRITISKE_MAEND = ["Daniel", "Google UK English Male", "Ryan", "Thomas",
  "George", "Arthur", "Oliver", "Alfie", "Elliot", "Ethan", "Noah", "Malcolm"];
const KVINDER = /female|kate|serena|stephanie|martha|libby|sonia|maisie|hazel|susan|mia|bella|abbi|hollie|olivia/i;

function britiskMand(alle){
  const gb = alle.filter(v => /^en[-_]GB/i.test(v.lang));
  for (const navn of BRITISKE_MAEND){
    const v = gb.find(v => v.name.includes(navn)) || alle.find(v => v.name.startsWith(navn + " ") || v.name === navn);
    if (v) return v;
  }
  return gb.find(v => !KVINDER.test(v.name)) || null;
}
